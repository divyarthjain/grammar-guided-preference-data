[project]
name = "simulation"
version = "0.1.0"
description = "MuJoCo-based training-time physical judge for grammar-guided-preference-data (see ../docs/architecture.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.11.0",
    "numpy>=2.5.1",
    "training",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
training = { path = "../training", editable = true }
