[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
grammar = { path = "../grammar" }
judge = { path = "../judge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

